name: Android Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"

          SHORT_SHA="${GITHUB_SHA::7}"
          OUTPUT_DIR="dist"
          OUTPUT_NAME="AniWorldAndroid-${VERSION_NAME}-${VERSION_CODE}-debug-${SHORT_SHA}.apk"

          mkdir -p "$OUTPUT_DIR"
          cp "$APK_PATH" "$OUTPUT_DIR/$OUTPUT_NAME"

          echo "artifact_name=AniWorldAndroid-debug-${VERSION_NAME}-${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_path=$OUTPUT_DIR/$OUTPUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
